<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>movies i loved in 2025</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="lb-page">

    <header class="lb-header-block">
      <div class="lb-header">
        <div class="lb-avatar">you</div>
        <span class="lb-username">@giraffeluver (https://letterboxd.com/giraffeluver/)</span>
      </div>
      <h1 class="lb-title">2025 fav films heheheh</h1>
      <p class="lb-subtitle">my yr in cinema &nbsp;&bull;&nbsp; <span id="film-count"></span> films</p>
    </header>

    <div class="grid" id="grid"></div>

  </div>

  <div class="modal-overlay" id="overlay">
    <div class="modal-wrap">
      <div class="modal" id="modal">
        <div class="modal-top">
          <div class="modal-poster" id="modal-poster"></div>
          <div class="modal-info">
            <div class="modal-rank" id="modal-rank"></div>
            <div class="modal-title" id="modal-title"></div>
            <div class="modal-year-dir" id="modal-year-dir"></div>
            <div class="modal-stars" id="modal-stars"></div>
          </div>
        </div>
        <div class="modal-body">
          <p class="modal-desc" id="modal-desc"></p>
          <div class="modal-tags" id="modal-tags"></div>
        </div>
      </div>
      <button class="modal-close" id="modal-close">&#x2715;</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
